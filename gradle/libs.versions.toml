[versions]
kona = "0.1.0-SNAPSHOT"
kotlin = "2.1.20"
kover = "0.9.1"
maven-publish = "0.34.0"
junit = "5.12.2"
slf4j = "2.0.17"
logback = "1.5.18"
jackson = "2.18.3"
hikaricp = "6.3.0"
h2 = "2.3.232"
bcrypt = "0.10.2"
lettuce = "6.5.5.RELEASE"
netty = "4.1.119.Final"

[libraries]
kona-core = { module = "org.konaframework:kona-core", version.ref = "kona" }
kona-http = { module = "org.konaframework:kona-http", version.ref = "kona" }
kona-crema = { module = "org.konaframework:kona-crema", version.ref = "kona" }
kona-session = { module = "org.konaframework:kona-session", version.ref = "kona" }
kona-support = { module = "org.konaframework:kona-support", version.ref = "kona" }
kona-grind = { module = "org.konaframework:kona-grind", version.ref = "kona" }
kona-testing = { module = "org.konaframework:kona-testing", version.ref = "kona" }
kona-auth = { module = "org.konaframework:kona-auth", version.ref = "kona" }
kona-cadence = { module = "org.konaframework:kona-cadence", version.ref = "kona" }
kona-filesystem = { module = "org.konaframework:kona-filesystem", version.ref = "kona" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-scripting-jsr223 = { module = "org.jetbrains.kotlin:kotlin-scripting-jsr223", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
