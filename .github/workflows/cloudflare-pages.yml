name: Cloudflare Pages

# Primary docs host: https://brew.konaframework.org
# Worker (Workers Assets): kona-brew-docs — custom domain brew.konaframework.org
#
# First publish: Cloudflare Workers Builds Git integration (no GitHub secrets).
#   Framework preset: None (not Astro)
#   Root: apps/docs · Build: npm ci && npm run build
#     (or Root: / · Build: npm ci --prefix apps/docs && npm run build --prefix apps/docs)
#   Deploy: npx wrangler deploy  (ONLY — never "wrangler pages deploy" / --project-name)
#   Preview: npx wrangler preview (wrangler.jsonc has "previews": {})
#   PUBLIC_SITE_URL=https://brew.konaframework.org · PUBLIC_BASE_PATH=/ · NODE_VERSION=22
#   (npm + apps/docs/package-lock.json — not Kona monorepo pnpm)
# Optional harden: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID for Wrangler deploy.
# See docs/governance/docs-site.md

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install dependencies
        working-directory: apps/docs
        run: npm ci
      - name: Build docs
        working-directory: apps/docs
        env:
          PUBLIC_SITE_URL: https://brew.konaframework.org
          PUBLIC_BASE_PATH: /
        run: npm run build
      - name: Check optional Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_* secrets — build-only. Deploy via Cloudflare Workers Builds; see docs/governance/docs-site.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Workers (static assets)
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy
