<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Brew for Kona">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1612"/>
      <stop offset="0.55" stop-color="#140E0B"/>
      <stop offset="1" stop-color="#100C09"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 200) rotate(25) scale(520 380)">
      <stop stop-color="#D48C46" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D48C46" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 480) rotate(-20) scale(420 300)">
      <stop stop-color="#FAEDCD" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FAEDCD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copper" x1="18%" y1="100%" x2="82%" y2="8%">
      <stop stop-color="#BA622A"/>
      <stop offset="0.5" stop-color="#D48C46"/>
      <stop offset="1" stop-color="#E5A869"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop stop-color="#E5A869"/>
      <stop offset="1" stop-color="#FAEDCD"/>
    </linearGradient>
  </defs>
  <!-- Social cards need a solid backdrop; mark itself stays transparent (no app-icon plate). -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <g transform="translate(88,145) scale(1.35)">
    <g stroke="url(#copper)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path stroke-width="8" d="M70 130 L78 186 Q80 200 96 200 L156 200 Q172 200 174 186 L182 130 Z"/>
      <path stroke-width="7" d="M70 130 H182"/>
      <path stroke-width="8" d="M182 140 C208 142 212 176 176 184"/>
      <path stroke-width="7" opacity="0.85" d="M64 214 H188"/>
    </g>
    <g stroke="url(#copper)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M94 120 C86 100 100 84 92 64"/>
      <path d="M162 120 C170 100 156 84 164 64"/>
    </g>
    <g stroke="url(#cream)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M116 74 C108 74 106 68 106 62 C106 52 98 50 94 50 C98 50 106 48 106 38 C106 32 108 26 116 26"/>
      <path d="M140 74 C148 74 150 68 150 62 C150 52 158 50 162 50 C158 50 150 48 150 38 C150 32 148 26 140 26"/>
    </g>
  </g>
  <text x="420" y="280" font-family="Outfit, system-ui, sans-serif" font-size="108" font-weight="800" fill="#E5A869">Brew</text>
  <text x="420" y="350" font-family="Outfit, system-ui, sans-serif" font-size="40" font-weight="600" fill="#FAEDCD">for the Kona framework</text>
  <text x="420" y="420" font-family="Outfit, system-ui, sans-serif" font-size="32" font-weight="500" fill="#D48C46">Reactive server components</text>
</svg>
